[project]
name = "news-bridge"
version = "0.1.0"
description = "An evidence-first bridge between international news perspectives"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3", "trafilatura>=2,<3", "defusedxml>=0.7,<1"
]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
[tool.ruff]
line-length = 100
